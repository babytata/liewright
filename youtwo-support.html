<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support - YouTwo</title>
    <style>
        :root {
            --primary: #0066ff;
            --secondary: #00d4ff;
            --accent: #ff3366;
            --dark: #0a0a0f;
            --light: #f8f9fc;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Animated gradient background */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 102, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 51, 102, 0.05) 0%, transparent 80%);
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-5%, 5%) scale(1.05); }
            66% { transform: translate(5%, -5%) scale(0.95); }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 15, 0.6);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--light);
            text-decoration: none;
            font-weight: 500;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        /* Support Form Section */
        .support-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8rem 2rem 4rem;
            position: relative;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p.subtitle {
            margin-bottom: 3rem;
            font-size: 1.15rem;
            text-align: center;
            color: rgba(248, 249, 252, 0.7);
            max-width: 600px;
        }

        .contact-form {
            background: rgba(10, 10, 15, 0.8);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: rgba(248, 249, 252, 0.8);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--light);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.3);
        }

        .form-message.success { background-color: rgba(40, 167, 69, 0.2); color: #28a745; border: 1px solid rgba(40, 167, 69, 0.5); }
        .form-message.error { background-color: rgba(220, 53, 69, 0.2); color: #ff6b6b; border: 1px solid rgba(220, 53, 69, 0.5); }

        /* Footer */
        footer {
            padding: 2rem 4rem;
            border-top: 1px solid var(--border);
            text-align: center;
            color: rgba(248, 249, 252, 0.5);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav { padding: 1rem 2rem; }
            .nav-links { display: none; }
            .contact-form { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>

    <nav>
        <a href="youtwo-landing.html" class="logo">YouTwo</a>
        <ul class="nav-links">
            <li><a href="youtwo-landing.html#features">Features</a></li>
            <li><a href="youtwo-landing.html#use-cases">Use Cases</a></li>
        </ul>
    </nav>

    <div class="support-container">
        <h1>Contact Support</h1>
        <p class="subtitle">Have a question, feedback, or need help with YouTwo? Send us a message and we'll get back to you shortly.</p>

        <div class="contact-form">
            <!-- The form configured for Netlify automatically -->
            <form name="youtwo-support" id="youtwo-support-form" method="POST" data-netlify="true">
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="device_version">App Version & Phone Model (Optional)</label>
                    <input type="text" id="device_version" name="device_version" placeholder="e.g., iOS 17, iPhone 15 Pro">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required placeholder="Describe your issue or provide feedback..."></textarea>
                </div>
                <button type="submit" class="form-submit">Send Message</button>
                <div id="form-status" class="form-message" style="display: none; margin-top: 15px; padding: 15px; border-radius: 10px; text-align: center;"></div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 YouTwo. Built with intention for people who think deeply.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const supportForm = document.getElementById('youtwo-support-form');
            const submitBtn = document.querySelector('.form-submit');
            const formStatus = document.getElementById('form-status');

            if (supportForm) {
                supportForm.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    submitBtn.textContent = "Sending...";
                    submitBtn.disabled = true;
                    formStatus.style.display = 'none';
                    formStatus.className = 'form-message'; // Reset

                    const formData = {
                        first_name: document.getElementById('first_name').value,
                        last_name: document.getElementById('last_name').value,
                        email: document.getElementById('email').value,
                        device_version: document.getElementById('device_version').value,
                        message: document.getElementById('message').value
                    };

                    try {
                        const response = await fetch('/.netlify/functions/submitTicket', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(formData)
                        });

                        const result = await response.json();

                        if (response.ok) {
                            formStatus.textContent = "Thank you! Your support ticket has been sent.";
                            formStatus.classList.add('success');
                            supportForm.reset();
                        } else {
                            throw new Error(result.error || "Failed to submit form");
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        formStatus.textContent = "Oops! There was a problem submitting your ticket. Please try again later.";
                        formStatus.classList.add('error');
                    } finally {
                        formStatus.style.display = 'block';
                        submitBtn.textContent = "Send Message";
                        submitBtn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
